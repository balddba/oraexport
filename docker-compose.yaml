services:
  api:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: ./backend
    env_file: .env
    command: ["oraexport-worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
