services:
  oraexport-api:
    container_name: oraexport-api
    build: ./backend
    environment: &backend-environment
      METADATA_URL: ${METADATA_URL:?Set METADATA_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      GLOBAL_CONCURRENCY: ${GLOBAL_CONCURRENCY:-2}
      TARGET_CONCURRENCY: ${TARGET_CONCURRENCY:-1}
      POLL_SECONDS: ${POLL_SECONDS:-5}
      METADATA_POOL_MAX: ${METADATA_POOL_MAX:-10}
      METADATA_POOL_WAIT_MS: ${METADATA_POOL_WAIT_MS:-5000}
      METADATA_CALL_TIMEOUT_MS: ${METADATA_CALL_TIMEOUT_MS:-20000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  oraexport-worker:
    container_name: oraexport-worker
    build: ./backend
    environment: *backend-environment
    command: ["oraexport-worker"]
    depends_on:
      oraexport-api:
        condition: service_healthy
    restart: unless-stopped
  oraexport-frontend:
    container_name: oraexport-frontend
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    networks:
      - default
      - reverse-proxy # Comment this out to disable reverse proxy
    depends_on:
      oraexport-api:
        condition: service_healthy
    restart: unless-stopped

# Coment this out to disable reverse proxy
networks:
  reverse-proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK}
